name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install --legacy-peer-deps

      - name: Build Web Application
        env:
          VITE_API_BASE_URL: "https://wife-romp-down.ngrok-free.dev"
        run: |
          cd frontend
          npm run build

      - name: Sync Capacitor Android
        run: |
          cd frontend
          npx --yes @capacitor/cli sync android

      - name: Build Android APK with Gradle
        run: |
          cd frontend/android
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Rename APK for Release
        run: |
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk frontend/android/app/build/outputs/apk/debug/HireAi.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HireAi-Android-App
          path: frontend/android/app/build/outputs/apk/debug/HireAi.apk

      - name: Create or Update Public GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.3
          name: "HireAi Android App v1.0.3"
          body: "HireAi Android APK with In-App Auto-Updater and enhanced mobile responsive UI. Download `HireAi.apk` below."
          files: frontend/android/app/build/outputs/apk/debug/HireAi.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
